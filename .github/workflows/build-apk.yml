name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project source
        run: |
          unzip -o friendconnect_flutter_source.zip -d _src
          cp -r _src/lib .
          cp _src/pubspec.yaml .
          cp _src/.gitignore . || true
          rm -rf _src friendconnect_flutter_source.zip

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # Google Sign-In's OAuth client is registered against a specific SHA-1
      # certificate fingerprint. This project ships release builds signed
      # with the debug keystore (see note below), and GitHub Actions runners
      # are ephemeral — without this step, Android's tooling would generate
      # a BRAND NEW random debug keystore on every single run, so the SHA-1
      # (and therefore Google Sign-In) would silently break build-to-build.
      # ci_keystore/debug.keystore is a fixed, checked-in, low-sensitivity
      # debug keystore (NOT the real release-signing key) whose SHA-1 is
      # permanently registered in Firebase, so every build produces the same
      # fingerprint.
      - name: Install fixed debug keystore (stable Google Sign-In SHA-1)
        run: |
          mkdir -p ~/.android
          cp ci_keystore/debug.keystore ~/.android/debug.keystore

      # This project intentionally ships without an android/ folder so the
      # build always uses Gradle/AGP versions matched to whatever Flutter
      # version this workflow installs, instead of hand-written files that
      # could drift out of date.
      - name: Generate Android platform project
        run: flutter create --platforms=android --project-name friendconnect .

      - name: Configure Firebase + real-call permissions
        run: |
          # Drop the Firebase Android config into the generated project.
          cp google-services.json android/app/google-services.json

          # Modern Flutter templates declare Gradle plugins (with versions)
          # in settings.gradle's `plugins {}` block, not via an
          # android/build.gradle buildscript{} classpath. Register the
          # google-services plugin version there...
          sed -i '/id "dev.flutter.flutter-plugin-loader"/a\    id "com.google.gms.google-services" version "4.4.2" apply false' android/settings.gradle

          # ...then actually apply it in the app module's plugins {} block.
          sed -i '/id "dev.flutter.flutter-gradle-plugin"/a\    id "com.google.gms.google-services"' android/app/build.gradle

          # Firebase/AndroidX libraries ship Kotlin metadata newer than the
          # template's default Kotlin plugin version, causing
          # "compiled with an incompatible version of Kotlin" errors.
          # Bump it regardless of whatever version the template pinned.
          # google_sign_in's transitive AndroidX deps (Credentials API etc.)
          # need a newer Kotlin than Firebase alone did, so bump further.
          sed -i -E 's/(id "org\.jetbrains\.kotlin\.android" version ")[^"]+(" apply false)/\12.0.21\2/' android/settings.gradle

          # Likewise bump the Android Gradle Plugin — the template's default
          # is too old to reliably resolve google_sign_in's newer AndroidX
          # transitive dependencies alongside a modern Kotlin plugin.
          sed -i -E 's/(id "com\.android\.application" version ")[^"]+(" apply false)/\18.3.2\2/' android/settings.gradle

          # AGP 8.3.2 requires Gradle 8.4+, but the generated wrapper still
          # points at an older Gradle. Bump the wrapper distribution too.
          sed -i -E 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-all.zip#' android/gradle/wrapper/gradle-wrapper.properties

          # flutter_plugin_android_lifecycle (pulled in transitively) needs
          # to compile against SDK 35, newer than this Flutter version's
          # default compileSdk.
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle

          # flutter_webrtc's native Android library needs API 24+. Modern
          # templates use property-assignment syntax (minSdk = ...) rather
          # than the old minSdkVersion(...) method call.
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle

          # Camera/mic/network permissions for real WebRTC calls.
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.BLUETOOTH"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <uses-feature android:name="android.hardware.camera.autofocus" android:required="false"/>\n\n    <application#' android/app/src/main/AndroidManifest.xml

          echo "----- android/settings.gradle -----"
          cat android/settings.gradle
          echo "----- android/build.gradle -----"
          cat android/build.gradle
          echo "----- android/app/build.gradle -----"
          cat android/app/build.gradle
          echo "----- AndroidManifest.xml -----"
          cat android/app/src/main/AndroidManifest.xml
          echo "----- gradle-wrapper.properties -----"
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: friendconnect-apk
          path: build/app/outputs/flutter-apk/app-release.apk
