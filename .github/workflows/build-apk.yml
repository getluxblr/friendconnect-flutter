name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project source
        run: |
          unzip -o friendconnect_flutter_source.zip -d _src
          cp -r _src/friendconnect_flutter/lib .
          cp _src/friendconnect_flutter/pubspec.yaml .
          cp _src/friendconnect_flutter/.gitignore . || true
          rm -rf _src friendconnect_flutter_source.zip

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android platform project
        run: flutter create --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: friendconnect-apk
          path: build/app/outputs/flutter-apk/app-release.apk
